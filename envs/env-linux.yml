name: KINTSUGI
channels:
  - conda-forge
  # nodefaults: stop conda from merging the user's .condarc channels (Miniconda and
  # Anaconda ship `channels: [defaults]`) into this solve. Without it, 'defaults' is
  # still used even though it is not listed here, and the cross-channel solve did not
  # finish within 25 minutes in testing. Miniforge is unaffected (conda-forge only).
  - nodefaults

# =============================================================================
# KINTSUGI Base Environment for Linux
# =============================================================================
# This is the ONLY environment file needed for Linux installation.
# Optional features (GPU, Napari, Deep Learning) are installed via pip after
# environment creation. See README.md for details.
#
# Installation:
#   conda env create -f envs/env-linux.yml
#   conda activate KINTSUGI
#   kintsugi check
#
# Optional features (run after base install):
#   kintsugi install gpu        # GPU acceleration (CuPy for CUDA)
#   kintsugi install torch      # PyTorch for deep learning models
#   kintsugi install bio        # Spatial biology analysis (scanpy, scimap, squidpy)
#   kintsugi install viz        # Napari visualization
#   kintsugi install all        # All optional features
# =============================================================================

dependencies:
  # Core Python
  - python=3.11
  - pip
  - setuptools
  - wheel

  # Core Scientific Computing
  # Version bounds below are solver pins, not feature requirements. Unbounded
  # specs let libmamba consider every historical build of these packages; with
  # conda 26.7 that solve ran for more than 25 minutes on this file. With the
  # bounds it takes about 80 seconds. numpy stays <2 (see constraints.txt).
  - numpy=1.26.*
  - scipy>=1.11,<2
  - pandas>=2.2,<3        # snakemake-executor-plugin-slurm requires pandas<3
  - scikit-learn>=1.3
  - scikit-image>=0.22
  - matplotlib>=3.8
  - seaborn-base>=0.13    # the 'seaborn' metapackage adds statsmodels, which nothing here uses

  # Image Processing
  - tifffile>=2024
  - imagecodecs>=2024,<2026.2   # >=2026.2 declares numpy>=2 on PyPI; pip would replace the conda build
  - imageio
  - pillow
  - libvips>=8.15

  # Jupyter Environment
  - jupyterlab>=4,<5
  - ipywidgets>=8
  - ipykernel

  # Data Handling
  - h5py>=3.9
  - zarr>=2.16
  - dask-core>=2024
  - tqdm
  - pyyaml
  - openpyxl

  # Utilities
  - click
  - packaging>=24,<26     # snakemake requires packaging<26 (see constraints.txt)
  - requests
  - psutil
  - natsort

  # Pip packages (core only)
  - pip:
    # KINTSUGI package (editable install)
    - -e ..

    # Core image processing
    - opencv-contrib-python-headless>=4.9.0
    - pyvips>=2.2.3

    # Bio formats (lightweight)
    - ome-types>=0.6.1

    # Visualization
    - stackview>=0.18.0
    - rich>=13.9.4

    # Workflow orchestration (HPC/SLURM)
    - snakemake>=8.0
    - snakemake-executor-plugin-slurm
    - snakemake-executor-plugin-slurm-jobstep

    # Utilities
    - pqdm>=0.2.0
