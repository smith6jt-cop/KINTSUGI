name: KINTSUGI
channels:
  - conda-forge
  - defaults

# =============================================================================
# KINTSUGI Base Environment for Linux
# =============================================================================
# This is the ONLY environment file needed for Linux installation.
# Optional features (GPU, Napari, Deep Learning) are installed via pip after
# environment creation. See README.md for details.
#
# Installation:
#   conda env create -f envs/env-linux.yml
#   conda activate KINTSUGI
#   kintsugi check
#
# Optional features (run after base install):
#   kintsugi install gpu        # GPU acceleration (CuPy for CUDA)
#   kintsugi install torch      # PyTorch for deep learning models
#   kintsugi install bio        # Spatial biology analysis (scanpy, scimap, squidpy)
#   kintsugi install viz        # Napari visualization
#   kintsugi install all        # All optional features
# =============================================================================

dependencies:
  # Core Python
  - python=3.11
  - pip
  - setuptools
  - wheel

  # Core Scientific Computing
  - numpy>=1.24,<2.0
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn

  # Image Processing
  - tifffile
  - imagecodecs
  - imageio
  - pillow
  - libvips

  # Jupyter Environment
  - jupyterlab
  - ipywidgets
  - ipykernel

  # Data Handling
  - h5py
  - zarr
  - dask-core
  - tqdm
  - pyyaml
  - openpyxl

  # Utilities
  - click
  - packaging
  - requests
  - psutil
  - natsort

  # Pip packages (core only)
  - pip:
    # KINTSUGI package (editable install)
    - -e ..

    # Core image processing
    - opencv-contrib-python-headless>=4.9.0
    - pyvips>=2.2.3

    # Bio formats (lightweight)
    - ome-types>=0.6.1

    # Visualization
    - stackview>=0.18.0
    - rich>=13.9.4

    # Workflow orchestration (HPC/SLURM)
    - snakemake>=8.0
    - snakemake-executor-plugin-slurm
    - snakemake-executor-plugin-slurm-jobstep

    # Utilities
    - pqdm>=0.2.0
