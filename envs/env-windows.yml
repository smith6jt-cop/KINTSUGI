name: KINTSUGI
channels:
  - conda-forge
  - defaults

# =============================================================================
# KINTSUGI Base Environment for Windows
# =============================================================================
# This is the ONLY environment file needed for Windows installation.
# Optional features (GPU, Napari, Deep Learning) are installed via pip after
# environment creation. See README.md for details.
#
# IMPORTANT: Windows requires additional setup for libvips.
# Download PyVips-dev from: https://zenodo.org/records/14969214
#
# Installation:
#   conda env create -f envs/env-windows.yml
#   conda activate KINTSUGI
#   pip install -e .
#
# Optional features (run after base install):
#   kintsugi install gpu        # GPU acceleration (PyTorch + CuPy)
#   kintsugi install viz        # Napari visualization
#   kintsugi install analysis   # Spatial analysis (scanpy, scimap)
#   kintsugi install dl         # Deep learning segmentation
#   kintsugi install full       # All optional features
# =============================================================================

dependencies:
  # Core Python
  - python=3.11
  - pip
  - setuptools
  - wheel

  # Core Scientific Computing
  - numpy>=1.24,<2.0
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn

  # Image Processing
  - tifffile
  - imagecodecs
  - imageio
  - pillow
  # Note: libvips must be installed separately on Windows (see README)

  # Jupyter Environment
  - jupyterlab
  - ipywidgets
  - ipykernel

  # Data Handling
  - h5py
  - zarr
  - dask-core
  - tqdm
  - pyyaml
  - openpyxl

  # Utilities
  - click
  - packaging
  - requests
  - psutil
  - natsort
  - numba

  # Pip packages (core only)
  - pip:
    # KINTSUGI package (editable install)
    - -e ..

    # Core image processing
    - valis-wsi>=1.2.0
    - basicpy>=1.2.0
    - opencv-contrib-python-headless>=4.9.0
    - pyvips>=2.2.3

    # Bio formats (lightweight)
    - ome-types>=0.6.1

    # Visualization
    - stackview>=0.18.0
    - rich>=13.9.4

    # Workflow orchestration
    - snakemake>=8.0
    - snakemake-executor-plugin-slurm

    # Utilities
    - tenacity>=9.1.2
    - pqdm>=0.2.0
