name: KINTSUGI
channels:
  - conda-forge
  - defaults

# =============================================================================
# KINTSUGI Base Environment for macOS
# =============================================================================
# This is the ONLY environment file needed for macOS installation.
# Optional features (Napari, Deep Learning) are installed via pip after
# environment creation. See README.md for details.
#
# Note: GPU acceleration via CUDA is not available on macOS.
# Apple Silicon Macs can use MPS (Metal Performance Shaders) via PyTorch.
#
# Installation:
#   brew install vips  # Install libvips first
#   conda env create -f envs/env-macos.yml
#   conda activate KINTSUGI
#   pip install -e .
#
# Optional features (run after base install):
#   kintsugi install torch      # PyTorch for deep learning models
#   kintsugi install bio        # Spatial biology analysis (scanpy, scimap, squidpy)
#   kintsugi install viz        # Napari visualization
# =============================================================================

dependencies:
  # Core Python
  - python=3.10
  - pip
  - setuptools
  - wheel

  # Core Scientific Computing
  - numpy>=1.24,<2.0
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn

  # Image Processing
  - tifffile
  - imagecodecs
  - imageio
  - pillow
  # Note: libvips should be installed via brew on macOS

  # Jupyter Environment
  - jupyterlab
  - ipywidgets
  - ipykernel

  # Data Handling
  - h5py
  - zarr
  - dask-core
  - tqdm
  - pyyaml
  - openpyxl

  # Utilities
  - click
  - packaging
  - requests
  - psutil
  - natsort
  - numba

  # Pip packages (core only)
  - pip:
    # KINTSUGI package (editable install)
    - -e ..

    # Core image processing
    - basicpy>=1.2.0
    - opencv-contrib-python-headless>=4.9.0
    - pyvips>=2.2.3

    # Bio formats (lightweight)
    - ome-types>=0.6.1

    # Visualization
    - stackview>=0.18.0
    - rich>=13.9.4

    # Utilities
    - tenacity>=9.1.2
    - pqdm>=0.2.0
