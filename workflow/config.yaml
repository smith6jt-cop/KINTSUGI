# =============================================================================
# KINTSUGI Snakemake Pipeline Configuration
# =============================================================================
# This is a TEMPLATE. Use 'kintsugi workflow config .' to auto-generate
# a project-specific config.yaml from meta/experiment.json.
#
# Usage:
#   kintsugi workflow check .                              # Verify resources
#   snakemake --profile profiles/slurm -j 13 --resources gpus=3  # Dual-pool
#   snakemake --cores 4                                    # Local execution
# =============================================================================

# ---------------------------------------------------------------------------
# Paths (REQUIRED - update these for your project)
# ---------------------------------------------------------------------------
project_dir: /path/to/my_project
kintsugi_dir: /path/to/KINTSUGI

# ---------------------------------------------------------------------------
# Processing scope
# ---------------------------------------------------------------------------
# Which cycles to process (list of integers)
cycles: [1, 2, 3, 4, 5, 6, 7]

# Which channels to process (list of integers)
channels: [1, 2, 3, 4]

# Output format: tiff or zarr
output_format: tiff

# ---------------------------------------------------------------------------
# Channel names (auto-populated from meta/CHANNELNAMES.txt)
# ---------------------------------------------------------------------------
# Maps cycle number -> list of marker names for marker-named EDF output.
# Empty dict falls back to CH#_edf.tif naming.
channel_names: {}

# ---------------------------------------------------------------------------
# Tile grid (for stitching)
# ---------------------------------------------------------------------------
tile_rows: 5
tile_cols: 5
tile_overlap: 0.3

# ---------------------------------------------------------------------------
# Microscope parameters (from experiment.json)
# ---------------------------------------------------------------------------
xy_pixel_size: 377.0      # nm per pixel XY
z_step_size: 1500.0       # nm per z-slice
numerical_aperture: 0.75
tissue_refractive_index: 1.44
n_zplanes: 15

# Wavelengths per channel: {channel: [excitation_nm, emission_nm]}
wavelengths:
  '1': [358.0, 461.0]     # DAPI
  '2': [488.0, 525.0]     # FITC / Alexa 488
  '3': [560.0, 575.0]     # TRITC / Cy3
  '4': [648.0, 668.0]     # Cy5

# ---------------------------------------------------------------------------
# Stitching parameters
# ---------------------------------------------------------------------------
ncc_threshold: 0.078
pou: 0.5
blend_sigma: 15.0

# BaSiC illumination correction
basic_flatfield_min: 0.1
basic_max_iterations: 500
basic_optimization_tolerance: 1.0e-6

# ---------------------------------------------------------------------------
# EDF parameters
# ---------------------------------------------------------------------------
edf:
  radius_x: 2
  radius_y: 2
  sigma: 10.0
  tiles: [3, 3]
  blend_depth: 0
  z_smooth_sigma: 1.0

# Quality gate thresholds for EDF
quality_gate:
  max_zero_pct: 0.10
  max_sat_pct: 0.05
  min_valid_slices: 3

# ---------------------------------------------------------------------------
# Registration parameters (multi-cycle alignment via VALIS)
# ---------------------------------------------------------------------------
registration:
  reference_cycle: 1          # Cycle used as fixed reference
  reference_channel: 1        # Channel for feature detection (usually DAPI)
  max_image_dim: 4096         # Rigid feature detection resolution
  rigid_only: false           # Non-rigid enabled with tuned smoothing
  feature_detector: "VggFD"   # "VggFD" (GPU, better) or "OrbFD" (CPU-only)
  imgs_ordered: true          # Keep sequential cycle order (don't reorder by similarity)
  align_to_reference: true    # All cycles align directly to reference (not serial)
  normalize_dimensions: true  # Pad images to uniform (max_h, max_w) for VALIS
  non_rigid:
    max_dim: 4096             # Displacement field resolution for register_micro()
    smoothing_method: "gauss" # Only "gauss" and None work
    sigma_ratio: 0.01         # sigma = 0.01 * 4096 = ~41px
    n_grid_pts: 50            # No-op with "gauss"
    fold_penalty: 1.0e-6      # No-op with "gauss"

# ---------------------------------------------------------------------------
# SLURM resource defaults (dual-pool architecture)
# ---------------------------------------------------------------------------
resources:
  # GPU pool account/partition
  account_gpu: maigan
  partition_gpu: hpg-b200

  # CPU pool account/partition (independent from GPU pool)
  account_cpu: clive
  partition_cpu: hpg-default

  qos: ""
  conda_env: kintsugi

  # Dual-pool slots (auto-detected via sacctmgr by 'kintsugi workflow config')
  gpu_slots: 0       # Set by auto-detection
  cpu_slots: 0       # Set by auto-detection
  total_slots: 0     # gpu_slots + cpu_slots

  # GPU job resources (per step, in MB and minutes)
  mem_stitch: 48000
  mem_decon: 48000
  mem_edf: 48000
  time_stitch: 240
  time_decon: 240
  time_edf: 60

  # CPU job resources
  cpu_cpus_per_task: 8
  cpu_time_multiplier: 5
  cpu_mem_stitch: 48000
  cpu_mem_decon: 48000
  cpu_mem_edf: 48000

# ---------------------------------------------------------------------------
# Spillover correction (REDSEA) - post-segmentation
# ---------------------------------------------------------------------------
# REDSEA corrects lateral signal spillover between neighboring cells.
# Only relevant for densely-packed immune tissues. CPU-only (no GPU needed).
# Reference: Bai et al., Front. Immunol. 12:652631 (2021)
redsea:
  element_shape: "star"          # "star" (diamond, recommended) or "square"
  element_size: 0                # 0 = auto-estimate from cell size (2-4 typical)
  markers_of_interest: []        # Empty = auto-detect surface markers

# ---------------------------------------------------------------------------
# 3D Vessel Segmentation (Frangi + skeleton) - standalone
# ---------------------------------------------------------------------------
# Segments blood/lymphatic vessels from deconvolved 3D z-stacks.
# Invoke explicitly: snakemake vessel3d --profile profiles/slurm --config vessel_cycle=3
vessel3d:
  channel: 2              # Channel index (1-based) for vessel marker
  marker: "CD31"          # Marker name for output filenames
  sigmas: [1, 2, 4, 8]   # Frangi scale space (microns)
  min_size: 500           # Min object volume (voxels)
  prune_min_um: 5.0       # Min branch length before pruning (microns)
