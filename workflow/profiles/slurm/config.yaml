# =============================================================================
# KINTSUGI Snakemake SLURM Profile
# =============================================================================
# Configures Snakemake to submit jobs via SLURM.
# Requires: snakemake >= 8.0, snakemake-executor-plugin-slurm
#
# Account and partition are set per-rule in the Snakefile via lambda
# resources, NOT here. Use 'kintsugi workflow check .' to see available
# slots across all accounts.
#
# Usage:
#   snakemake --profile profiles/slurm
#   kintsugi workflow run .                    # auto-sets -j from live availability
# =============================================================================

executor: slurm

# Activate the existing KINTSUGI conda environment on compute nodes.
# Without this, srun inherits a bare shell and conda-installed packages
# (cupy, torch, etc.) are not available.
#
# Cache redirection: Sources the account-specific conda switcher which sets
# BLUE_BASE and redirects ALL caches (pip, torch, numba, jupyter, XDG) from
# the limited home directory to /blue/{account}/smith6jt/scratch/cache/.
# SLURM_JOB_ACCOUNT is set by SLURM from the --account flag in each rule.
# Falls back to maigan if unset (e.g., local runs).
precommand: "source ~/.use_conda_${SLURM_JOB_ACCOUNT:-maigan}.sh 2>/dev/null; conda activate KINTSUGI && export LD_LIBRARY_PATH=$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cuda_nvrtc/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cublas/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cuda_runtime/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cufft/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cusolver/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cusparse/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/curand/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/nvjitlink/lib:$CONDA_PREFIX/lib/python3.11/site-packages/nvidia/cudnn/lib:${LD_LIBRARY_PATH:-}"

# Default SLURM settings (per-rule resources override these)
default-resources:
  mem_mb: 48000
  runtime: 240           # minutes
  cpus_per_task: 4

# Maximum concurrent SLURM jobs
# Override with -j flag (e.g., -j 24 for 5 GPU + 19 CPU slots)
jobs: 8

# NFS latency tolerance (seconds)
# Snakemake waits this long for output files to appear after a job completes.
# Replaces the wait_for_input() polling loops in the old job scripts.
latency-wait: 120

# Automatic retry on failure (replaces manual resubmission)
retries: 2

# Continue running independent jobs when one fails
keep-going: true
