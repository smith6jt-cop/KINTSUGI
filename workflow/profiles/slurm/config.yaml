# =============================================================================
# KINTSUGI Snakemake SLURM Profile
# =============================================================================
# Configures Snakemake to submit jobs via SLURM.
# Requires: snakemake >= 8.0, snakemake-executor-plugin-slurm
#
# Account and partition are set per-rule in the Snakefile via lambda
# resources, NOT here. Use 'kintsugi workflow check .' to see available
# slots across all accounts.
#
# Usage:
#   snakemake --profile profiles/slurm
#   kintsugi workflow run .                    # auto-sets -j from live availability
# =============================================================================

executor: slurm

# Default SLURM settings (per-rule resources override these)
default-resources:
  mem_mb: 48000
  runtime: 240           # minutes
  cpus_per_task: 4

# Maximum concurrent SLURM jobs
# Override with -j flag (e.g., -j 13 for 3 GPU + 10 CPU slots)
jobs: 8

# NFS latency tolerance (seconds)
# Snakemake waits this long for output files to appear after a job completes.
# Replaces the wait_for_input() polling loops in the old job scripts.
latency-wait: 120

# Automatic retry on failure (replaces manual resubmission)
retries: 2

# Continue running independent jobs when one fails
keep-going: true
