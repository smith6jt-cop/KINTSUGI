# Conda environment specification for KINTSUGI Snakemake rules.
# Used by Snakemake when --use-conda is enabled.
# This defines the minimal dependencies needed for processing.
name: kintsugi
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy<2.0
  - scipy
  - pandas
  - scikit-image
  - matplotlib
  - pip
  - pip:
    - kintsugi
