# KINTSUGI GPU processing environment
# Used by Snakemake --use-conda for stitch/deconvolve/edf rules
# Mirrors: conda base install + pip install -e ".[gpu]"
channels:
  - conda-forge
  - bioconda
  # NOTE: Do NOT add 'defaults' here. Miniforge uses conda-forge only.
  # Adding defaults causes solver hangs due to cross-channel conflicts.
dependencies:
  - python=3.11
  - numpy>=1.24,<2.0
  - scipy
  - pandas
  - scikit-image
  - tifffile
  - pyyaml
  - pillow
  - setuptools
  - psutil
  - tqdm
  - matplotlib
  - seaborn
  - requests
  - click
  - dask-core
  - zarr
  - h5py
  - imageio
  - natsort
  - imagecodecs
  - libvips
  - openpyxl
  - pip
  - wheel
  - pip:
    - kintsugi[gpu] @ file:///blue/maigan/smith6jt/KINTSUGI
