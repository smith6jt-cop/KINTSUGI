name: KINTSUGI_streamlined
channels:
  - conda-forge
  - pytorch
  - nvidia

dependencies:
  # Core Python Environment
  - python=3.10
  - pip
  - setuptools
  - wheel
  
  # Essential System Libraries
  - ca-certificates
  - certifi
  - openssl
  - libffi
  - libzlib
  - ucrt
  - vc
  - vc14_runtime
  - vs2015_runtime
  
  # Core Scientific Computing
  - numpy=1.26
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn
  - networkx
  - statsmodels
  
  # Image Processing Core
  - pyimagej
  - tifffile
  - imageio
  - pillow
  - simpleitk
  
  # CUDA/GPU Support (Essential for performance)
  - cudnn
  - cuda-runtime
  - cuda-libraries
  - pytorch-mutex=1.0
  - pytorch
  - torchvision
  - cupy
  
  # Napari Core (Essential for visualization)
  - napari=0.4.19
  - napari-plugin-engine
  - vispy
  - pyqt=5.15
  - qt-main=5.15
  
  # Essential Napari Plugins (Core functionality only)
  - napari-console
  - napari-crop
  - napari-simpleitk-image-processing
  - napari-skimage-regionprops
  
  # Jupyter Environment (Essential for notebooks)
  - jupyter
  - jupyter_core
  - jupyter_client
  - jupyterlab
  - notebook
  - ipykernel
  - ipython
  - ipywidgets
  
  # Java/ImageJ Integration (Essential for FIJI)
  - openjdk=11
  - maven
  - jpype1
  
  # Machine Learning/Analysis Core
  - dask-core
  - numba
  - umap-learn
  - scanpy
  - anndata
  - hdbscan
  
  # File I/O and Data Handling
  - h5py
  - zarr
  - xarray
  - fsspec
  - tqdm
  - pyyaml
  - toml
  - openpyxl
  
  # Essential Utilities
  - click
  - packaging
  - requests
  - psutil
  - joblib
  - natsort
  
  # OpenCL for GPU processing
  - pyopencl
  - opencl-headers
  
  # Essential pip packages for specialized functionality
  - pip:
    # Core image processing extensions
    - valis-wsi==1.2.0
    - basicpy==1.2.0
    - aicsimageio==3.3.1
    - bioio==3.0.0
    - bioio-ome-tiff==1.4.0
    - ome-types==0.6.1
    - ome-zarr==0.11.1
    - slideio==2.7.1
    - readlif==0.6.5
    - opencv-contrib-python-headless==4.9.0.80
    - pyvips==2.2.3
    
    # InstanSeg segmentation
    - instanseg==0.0.2
    - instanseg-torch==0.0.9
    - kornia==0.8.1
    
    # Napari plugin for segmentation
    - napari-segment-blobs-and-things-with-membranes==0.3.11
    
    # Analysis tools
    - phenograph==1.5.7
    - scimap==0.0.1
    - combat==0.3.3
    - fast-histogram==0.14
    - fastremap==1.17.1
    
    # Visualization
    - plotly==6.2.0
    - stackview==0.18.0
    - palettable==3.3.3
    
    # Cloud/distributed computing
    - distributed==2025.7.0
    - s3fs==2025.7.0
    - smart-open==7.3.0.post1
    
    # Utilities
    - rich==13.9.4
    - tenacity==9.1.2
    - pqdm==0.2.0
    - weightedstats==0.4.1
    
prefix: C:\Users\smith6jt\AppData\Local\anaconda3\envs\KINTSUGI_streamlined
