
  New Development Workflow

  1. Multi-Root Workspace

  Open the workspace with:
  code /blue/maigan/smith6jt/kintsugi-dev.code-workspace

  This opens three folders simultaneously:
  | Folder          | Purpose                           |
  |-----------------|-----------------------------------|
  | KINTSUGI (repo) | Code development, Claude sessions |
  | Test Project    | Quick testing with 2×2 grid       |
  | Full Project    | Real data testing                 |

  2. Test Dataset

  test_data/mini_project/
  ├── data/raw/
  │   ├── cyc001/   # 208 files (4 tiles × 13 z × 4 ch)
  │   ├── cyc002/
  │   └── cyc003/
  ├── meta/
  │   └── CHANNELNAMES.txt
  └── notebooks/    # Working copies

  Test grid parameters (for notebooks):
  n = 2  # rows
  m = 2  # columns  
  overlap_percentage = 30

  Size: 3.1 GB (vs ~50+ GB for full project)

  3. Workflow

  1. Make code changes in KINTSUGI (repo) folder
  2. Test immediately in Test Project folder (same VS Code window, same Claude session)
  3. Validate on full data in Full Project folder when ready

  4. Regenerate Test Data

  If needed, re-run:
  python test_data/setup_test_data.py
  kintsugi init test_data/mini_project --name "Dev Test 2x2" --force

  The center tiles (58, 59, 72, 73 from the 13×9 grid) were remapped to tiles 1-4 in proper snake pattern for the 2×2 test grid.