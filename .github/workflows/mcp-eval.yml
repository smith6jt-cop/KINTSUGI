name: MCP Eval

# Evaluates the KINTSUGI MCP tool surface.
#   * Structural pass (token cost, schema quality, tool coverage): runs on every
#     PR as a fast, deterministic gate (no API key, --strict fails on regressions
#     such as a documented-but-unregistered tool).
#   * Agentic tool-selection pass: runs on manual dispatch and weekly schedule
#     only (it spends API tokens and is nondeterministic, so it never runs on
#     PRs), once per configured provider (evals/mcp/providers.py):
#       anthropic: secret ANTHROPIC_API_KEY; model from the dispatch input or the
#                  EVAL_MODEL_ANTHROPIC variable (default below).
#       openai:    secret OPENAI_API_KEY and/or variable OPENAI_BASE_URL (any
#                  OpenAI-compatible endpoint); model from the dispatch input or
#                  the EVAL_MODEL_OPENAI variable (no default).
#     A provider without credentials or a model is skipped with a notice.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/kintsugi/mcp/**"
      - "src/kintsugi/cli.py"
      - "src/kintsugi/deps.py"
      - "pyproject.toml"
      - "evals/mcp/**"
      - "tests/test_mcp_*.py"
      - "docs/mcp.md"
      - "docs/cli.md"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/workflows/mcp-eval.yml"
  workflow_dispatch:
    inputs:
      anthropic_model:
        description: "Model for the anthropic provider (empty: EVAL_MODEL_ANTHROPIC or the default)"
        default: ""
      openai_model:
        description: "Model for the openai provider (empty: EVAL_MODEL_OPENAI; skipped if unset)"
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-eval:
    name: MCP tool-surface eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run structural evaluation
        run: python evals/mcp/harness.py --strict --json mcp_eval_report.json

      - name: Run agentic evaluation (each configured provider)
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          MODEL_ANTHROPIC: ${{ github.event.inputs.anthropic_model || vars.EVAL_MODEL_ANTHROPIC || 'claude-sonnet-4-6' }}
          MODEL_OPENAI: ${{ github.event.inputs.openai_model || vars.EVAL_MODEL_OPENAI }}
        run: |
          status=0
          for provider in anthropic openai; do
            case "$provider" in
              anthropic) configured="$ANTHROPIC_API_KEY"; model="$MODEL_ANTHROPIC" ;;
              openai) configured="$OPENAI_API_KEY$OPENAI_BASE_URL"; model="$MODEL_OPENAI" ;;
            esac
            if [ -z "$configured" ] || [ -z "$model" ]; then
              echo "::notice::Skipping the $provider agentic eval (no credentials or no model configured)."
              continue
            fi
            python evals/mcp/harness.py --agentic --provider "$provider" --model "$model" \
              --json "mcp_eval_report_${provider}.json" || status=1
          done
          exit "$status"

      - name: Write job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("mcp_eval_report.json")
          if not p.exists():
              print("No eval report produced.")
              raise SystemExit(0)
          r = json.loads(p.read_text())
          s = r["structural"]
          print("## MCP tool-surface eval\n")
          print(f"- Tools: **{s['tool_count']}** (output schemas: "
                f"{s['tools_with_output_schema']}/{s['tool_count']})")
          print(f"- Tool-definition tokens (est.): **~{s['total_definition_tokens_est']:,}**")
          print(f"- Params missing description: {s['params_missing_description_count']}")
          gaps = s["task_coverage_gaps"]
          print(f"- Task coverage gaps: {gaps if gaps else 'none'}")
          agentic = sorted(pathlib.Path().glob("mcp_eval_report_*.json"))
          for path in agentic:
              a = json.loads(path.read_text())["agentic"]
              print(f"\n### Agentic tool-selection ({a['provider']}): **{a['passed']}/"
                    f"{a['total']} = {a['accuracy']:.0%}** (model `{a['model']}`, "
                    f"host `{a['host']}`)\n")
              fails = [x for x in a["results"] if not x["pass"]]
              if fails:
                  print("| task | chose | expected |")
                  print("|------|-------|----------|")
                  for x in fails:
                      print(f"| {x['task']} | {x['chosen']} | {', '.join(x['expected'])} |")
          if not agentic:
              print("\n_Agentic pass skipped (PR event or no provider configured)._")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-eval-report
          path: mcp_eval_report*.json
