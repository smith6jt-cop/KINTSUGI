name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install commitizen
        run: pip install commitizen

      - name: Validate commit messages
        run: |
          # Get commits in this PR
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          echo "Checking commits from $BASE_SHA to $HEAD_SHA"

          # Get all commit messages
          COMMITS=$(git log --format="%s" ${BASE_SHA}..${HEAD_SHA})

          # Validate each commit
          ERRORS=0
          while IFS= read -r commit; do
            if [ -z "$commit" ]; then
              continue
            fi

            echo "Checking: $commit"

            # Check conventional commit format
            if echo "$commit" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:"; then
              echo "  ✓ Valid conventional commit"
            elif echo "$commit" | grep -qE "^Merge "; then
              echo "  ✓ Merge commit (allowed)"
            elif echo "$commit" | grep -qE "^Revert "; then
              echo "  ✓ Revert commit (allowed)"
            else
              echo "  ✗ Invalid commit format"
              echo "    Expected format: <type>(<scope>): <description>"
              echo "    Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$COMMITS"

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: $ERRORS commit(s) don't follow conventional commit format"
            echo ""
            echo "Please use the format: <type>(<scope>): <description>"
            echo ""
            echo "Examples:"
            echo "  feat(api): add new endpoint for user data"
            echo "  fix(ui): resolve button alignment issue"
            echo "  docs: update installation instructions"
            echo "  refactor(core): simplify data processing logic"
            echo ""
            echo "For breaking changes, add '!' before the colon:"
            echo "  feat(api)!: change response format"
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "All commits follow conventional commit format ✓"
