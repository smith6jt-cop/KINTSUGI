name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          pip install ruff black

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Check formatting with black
        run: black --check src/ tests/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix for faster CI
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vips

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:TEMP "vips-dev.zip"
          $dest = "C:\vips"

          Write-Output "Fetching latest libvips Windows build from build-win64-mxe..."

          # Windows builds are in a separate repository
          $apiUrl = "https://api.github.com/repos/libvips/build-win64-mxe/releases/latest"
          $headers = @{ "User-Agent" = "GitHub-Actions" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "token $env:GITHUB_TOKEN" }

          try {
            $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers -UseBasicParsing
            Write-Output "Found release: $($release.tag_name)"
          } catch {
            Write-Error "Failed to query libvips releases: $($_.Exception.Message)"
            throw
          }

          # Find Windows w64 zip asset (vips-dev-w64-web-*.zip is smaller, vips-dev-w64-all-*.zip is complete)
          $asset = $release.assets | Where-Object { $_.name -match 'vips-dev-w64-web.*\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            # Fallback to any w64 zip
            $asset = $release.assets | Where-Object { $_.name -match 'w64.*\.zip$' } | Select-Object -First 1
          }
          if (-not $asset) {
            Write-Error "No Windows (w64 .zip) asset found"
            Write-Output "Available assets: $($release.assets | ForEach-Object { $_.name })"
            throw "libvips asset not found"
          }

          Write-Output "Downloading asset $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -Headers $headers -UseBasicParsing

          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force

          $binDir = Get-ChildItem $dest -Recurse -Directory | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          if ($binDir) {
            Write-Output "Adding to PATH: $($binDir.FullName)"
            $binDir.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Output "libvips installed successfully"
          } else {
            Write-Error "Could not find bin directory in extracted archive"
            throw "libvips bin directory not found"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          pytest tests/ --cov=src/kintsugi --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-notebooks:
    name: Test Notebooks Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test notebook imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'notebooks')

          print('Testing Kreg import...')
          from Kreg import registration
          print('  OK: registration')
          from Kreg import slide_io
          print('  OK: slide_io')
          from Kreg import preprocessing
          print('  OK: preprocessing')

          print('Testing Kview2 import...')
          from Kview2 import imshow, curtain, crop
          print('  OK: visualization functions')

          print('Testing Kstitch import...')
          from Kstitch import stitch_images
          print('  OK: stitch_images')

          print('All notebook imports successful!')
          "

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run dependency check
        run: |
          python -c "
          from kintsugi.deps import check_dependencies
          result = check_dependencies(verbose=True)

          # Fail if required dependencies are missing
          if not result['all_required_ok']:
              missing = result['required']['missing']
              print(f'Missing required dependencies: {missing}')
              exit(1)
          "

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate README
        run: |
          python -c "
          import re
          with open('README.md') as f:
              content = f.read()

          # Check for broken links (basic check)
          links = re.findall(r'\[([^\]]+)\]\(([^)]+)\)', content)
          print(f'Found {len(links)} links in README')

          # Check for required sections
          required = ['Installation', 'Notebooks']
          for section in required:
              if section not in content:
                  print(f'Warning: Missing section: {section}')
          "
